<script>
  function addCopyButtons() {
    const codeBlocks = document.querySelectorAll('article#content pre');
    codeBlocks.forEach(pre => {
      if (pre.dataset.hasCopyButton) return;
      pre.dataset.hasCopyButton = "true";

      const wrapper = document.createElement('div');
      wrapper.className = 'code-wrapper';

      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(pre);

      const button = document.createElement('button');
      button.className = 'copy-btn';
      button.innerText = 'Copy';

      button.addEventListener('click', () => {
        const codeText = pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText;
        navigator.clipboard.writeText(codeText).then(() => {
          button.innerText = 'Copied!';
          setTimeout(() => {
            button.innerText = 'Copy';
          }, 2000);
        }).catch(err => {
          console.error('Failed to copy code: ', err);
        });
      });

      wrapper.appendChild(button);
    });
  }

  const observer = new MutationObserver(() => {
    addCopyButtons();
  });

  const contentTarget = document.getElementById('content');
  if (contentTarget) {
    observer.observe(contentTarget, { childList: true, subtree: true });
  }

  window.addEventListener('DOMContentLoaded', addCopyButtons);
</script>
